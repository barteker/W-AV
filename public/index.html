<!DOCTYPE html>
<html>
<head>
    <title>W/AV Player</title>
    <style>
        .controls {
            margin: 20px;
            padding: 10px;
        }
        button {
            margin: 5px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="status">Initializing...</div>
    <div class="controls">
        <button id="prevBtn">Previous</button>
        <button id="playPauseBtn">Play/Pause</button>
        <button id="nextBtn">Next</button>
    </div>
    <div id="nowPlaying"></div>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            window.location.href = '/auto-login';
        }

        window.onSpotifyWebPlaybackSDKReady = () => {
            const player = new Spotify.Player({
                name: 'W/AV Device',
                getOAuthToken: cb => { cb(token); }
            });

            player.addListener('ready', ({ device_id }) => {
                console.log('Device ready:', device_id);
                document.getElementById('status').textContent = 'Device Ready';
                fetch('/register-device', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ device_id })
                });
            });

            player.addListener('not_ready', ({ device_id }) => {
                console.log('Device lost connection:', device_id);
            });

            player.addListener('initialization_error', ({ message }) => {
                document.getElementById('status').textContent = 'Init Error: ' + message;
            });

            player.addListener('authentication_error', ({ message }) => {
                document.getElementById('status').textContent = 'Auth Error: ' + message;
                window.location.href = '/login';
            });

            player.addListener('player_state_changed', state => {
                if (state) {
                    document.getElementById('nowPlaying').textContent = 
                        `Now Playing: ${state.track_window.current_track.name}`;
                    document.getElementById('playPauseBtn').textContent = 
                        state.paused ? 'Play' : 'Pause';
                }
            });

            // Control buttons
            document.getElementById('playPauseBtn').onclick = () => {
                player.togglePlay();
            };

            document.getElementById('prevBtn').onclick = () => {
                player.previousTrack();
            };

            document.getElementById('nextBtn').onclick = () => {
                player.nextTrack();
            };

            player.connect().then(success => {
                if (!success) {
                    document.getElementById('status').textContent = 'Failed to connect';
                }
            });

            setInterval(() => {
                fetch('/refresh-token')
                    .then(response => response.json())
                    .then(data => {
                        if (data.token) {
                            window.location.reload();
                        }
                    })
                    .catch(error => {
                        document.getElementById('status').textContent = 'Token refresh failed';
                    });
            }, 30 * 60 * 1000);
        };
    </script>
</body>
</html>
