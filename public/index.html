<!DOCTYPE html>
<html>
<head>
    <title>W/AV Player</title>
    <style>
        body {
            background-color: #050505;
            color: aliceblue;
            @font-face {
                font-family: ClashGrotesk;
                src: url("ClashGrotesk-Variable.ttf");
            }
            font-family: 'ClashGrotesk', sans-serif;
        }
        .controls {
            margin: 20px;
            padding: 10px;
        }
        button {
            margin: 5px;
            padding: 10px;
        }
        #status {
            padding: 10px;
            margin: 10px;
            color: #c4c4c4;
        }
        .error {
            color: #e74c3c;
        }
        .library {
            margin: 20px;
            padding: 10px;
            max-height: 500px;
            overflow-y: auto;
        }
        .tabs {
            margin-bottom: 15px;
        }
        .tab-btn {
            background: #525252;
            color: white;
            border: none;
            padding: 10px 20px;
        }
        .tab-btn.active {
            background: #1db954;
        }
        .tab-btn.highlighted {
            background: #383838;
        }
        .library-item {
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #282828;
        }
        .library-item:hover {
            background: #282828;
        }
        .library-item img {
            width: 50px;
            height: 50px;
            margin-right: 15px;
        }
        .library-item.selected {
            background: #1db954;
        }
        .pagination-controls {
            text-align: center;
            margin: 10px 0;
        }
        .page-btn {
            background: #282828;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
        }
        .page-btn:hover {
            background: #383838;
        }
        .library-item.highlighted {
            background-color: #383838;
        }
        .back-button {
            background-color: #181818;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .back-button:hover {
            background-color: #282828;
        }
        .back-button.highlighted {
            background-color: #383838;
        }
        .artist {
            color: #b3b3b3;
            font-size: 0.9em;
        }
        :focus {
            outline: 2px solid #1db954;
            outline-offset: -2px;
        }
        .library-item:focus {
            background-color: #383838;
        }
        .tab-btn:focus {
            background-color: #383838;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="status">Checking token...</div>
    <div class="controls">
        <button id="prevBtn" disabled>Previous</button>
        <button id="playPauseBtn" disabled>Play/Pause</button>
        <button id="nextBtn" disabled>Next</button>
        <button id="logoutBtn">Logout</button>
    </div>
    <div class="library">
        <div class="tabs">
            <button class="tab-btn active" data-tab="playlists">Playlists</button>
            <button class="tab-btn" data-tab="albums">Albums</button>
            <button class="tab-btn" data-tab="songs">Liked Songs</button>
        </div>
        <div id="library-content"></div>
        <div class="pagination-controls">
            <button id="prevPage" class="page-btn" style="display: none;">↑ Previous Page</button>
            <button id="nextPage" class="page-btn">↓ Next Page</button>
        </div>
    </div>
    <div id="nowPlaying"></div>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            statusEl.textContent = 'No token found, redirecting...';
            window.location.href = '/auto-login';
        } else {
            statusEl.textContent = 'Token found, initializing player...';
        }

        // Move socket initialization outside of onSpotifyWebPlaybackSDKReady
        const socket = io();

        window.onSpotifyWebPlaybackSDKReady = () => {
            statusEl.textContent = 'SDK Ready, creating player...';

            const player = new Spotify.Player({
                name: 'W/AV Device',
                getOAuthToken: cb => { cb(token); },
                volume: 0.5
            });

            // Add not ready listener
            player.addListener('not_ready', ({ device_id }) => {
                console.log('Device ID has gone offline', device_id);
                statusEl.textContent = 'Device went offline, trying to reconnect...';
            });

            // Update ready listener
            player.addListener('ready', ({ device_id }) => {
                statusEl.textContent = 'Player ready, checking premium status...';
                
                // Check premium status first
                fetch('/check-premium', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.isPremium) {
                        return fetch('/register-device', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ device_id })
                        });
                    } else {
                        throw new Error('Premium account required');
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        statusEl.textContent = 'Device registered successfully';
                        document.getElementById('prevBtn').disabled = false;
                        document.getElementById('playPauseBtn').disabled = false;
                        document.getElementById('nextBtn').disabled = false;
                    }
                })
                .catch(error => {
                    statusEl.textContent = 'Error: ' + error.message;
                    statusEl.classList.add('error');
                });

                loadLibraryContent('playlists');
            });

            player.addListener('initialization_error', ({ message }) => {
                statusEl.textContent = 'Initialization Error: ' + message;
                statusEl.classList.add('error');
            });

            player.addListener('authentication_error', ({ message }) => {
                statusEl.textContent = 'Authentication Error: ' + message;
                statusEl.classList.add('error');
                setTimeout(() => window.location.href = '/login', 2000);
            });

            player.addListener('account_error', ({ message }) => {
                statusEl.textContent = 'Account Error: ' + message;
                statusEl.classList.add('error');
            });

            // Connect to the player
            statusEl.textContent = 'Connecting to Spotify...';
            player.connect().then(success => {
                if (success) {
                    statusEl.textContent = 'Connected to Spotify';
                } else {
                    statusEl.textContent = 'Failed to connect to Spotify';
                    statusEl.classList.add('error');
                }
            }).catch(error => {
                statusEl.textContent = 'Connection Error: ' + error.message;
                statusEl.classList.add('error');
            });

            player.addListener('player_state_changed', state => {
                if (state) {
                    document.getElementById('nowPlaying').textContent = 
                        `Now Playing: ${state.track_window.current_track.name}`;
                    document.getElementById('playPauseBtn').textContent = 
                        state.paused ? 'Play' : 'Pause';
                }
            });

            // Control buttons
            document.getElementById('playPauseBtn').onclick = () => {
                player.togglePlay();
            };

            document.getElementById('prevBtn').onclick = () => {
                player.previousTrack();
            };

            document.getElementById('nextBtn').onclick = () => {
                player.nextTrack();
            };

            setInterval(() => {
                fetch('/refresh-token')
                    .then(response => response.json())
                    .then(data => {
                        if (data.token) {
                            window.location.reload();
                        }
                    })
                    .catch(error => {
                        statusEl.textContent = 'Token refresh failed';
                    });
            }, 30 * 60 * 1000);

            // Add this inside your window.onSpotifyWebPlaybackSDKReady callback
            let audioContext;
            let sourceNode;
            let equalizer = [];
            const frequencies = [60, 170, 350, 1000, 3500, 10000, 15000];

            // Initialize Web Audio API
            function initAudioContext() {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // Create filters for each frequency band
                    frequencies.forEach((freq, index) => {
                        const filter = audioContext.createBiquadFilter();
                        filter.type = 'peaking';
                        filter.frequency.value = freq;
                        filter.Q.value = 1;
                        filter.gain.value = 0;
                        equalizer.push(filter);
                        
                        // Connect filters in series
                        if (index === 0) {
                            sourceNode = filter;
                        } else {
                            equalizer[index - 1].connect(filter);
                        }
                        
                        // Add event listeners to sliders
                        const slider = document.getElementById(`eq-${freq}`);
                        slider.value = "0"; // Ensure slider starts at middle position
                        slider.addEventListener('input', (e) => {
                            const value = parseFloat(e.target.value);
                            filter.gain.value = value;
                            console.log(`Setting ${freq}Hz to ${value}dB`); // Debug log
                        });
                    });
                    
                    // Connect the last filter to the destination
                    equalizer[equalizer.length - 1].connect(audioContext.destination);
                    
                    console.log('Audio context initialized successfully');
                } catch (error) {
                    console.error('Failed to initialize audio context:', error);
                }
            }

            // Initialize audio processing when player is ready
            player.addListener('ready', ({ device_id }) => {
                initAudioContext();
                // ... rest of your existing ready listener code ...
            });

            // Update audio processing when playback state changes
            player.addListener('player_state_changed', state => {
                if (state && state.track_window.current_track) {
                    // Get the audio element (this requires some browser-specific handling)
                    const audioElement = document.querySelector('audio');
                    if (audioElement) {
                        const source = audioContext.createMediaElementSource(audioElement);
                        source.connect(sourceNode);
                    }
                }
            });

            // Add this to your JavaScript
            document.getElementById('reset-eq').onclick = () => {
                equalizer.forEach((filter, index) => {
                    filter.gain.value = 0;
                    document.getElementById(`eq-${frequencies[index]}`).value = 0;
                });
            };

            // Add pagination handlers
            let currentPage = 0;
            const itemsPerPage = 20;

            document.getElementById('nextPage').onclick = () => {
                currentPage++;
                loadLibraryContent(currentTab, currentPage * itemsPerPage);
            };

            document.getElementById('prevPage').onclick = () => {
                if (currentPage > 0) {
                    currentPage--;
                    loadLibraryContent(currentTab, currentPage * itemsPerPage);
                }
            };

            // Update loadLibraryContent function to handle pagination
            function loadLibraryContent(tab, offset = 0) {
                const contentDiv = document.getElementById('library-content');
                contentDiv.innerHTML = 'Loading...';

                fetch(`/${tab}?offset=${offset}&limit=${itemsPerPage}`)
                    .then(response => response.json())
                    .then(items => {
                        // Update display
                        updateLibraryDisplay(items, offset);
                    })
                    .catch(error => {
                        contentDiv.innerHTML = `Error loading ${tab}: ${error.message}`;
                    });
            }

            // Handle WebSocket updates
            socket.on('display-update', (data) => {
                updateLibraryDisplay(data.items);
                // Highlight selected item
                document.querySelectorAll('.library-item').forEach((item, index) => {
                    item.classList.toggle('selected', index === data.current_item);
                });
            });

            // Update the socket.io handler in your JavaScript
            socket.on('interface-update', (data) => {
                if (data.select_tab) {
                    // Actually switch tabs and load content
                    const tabButtons = document.querySelectorAll('.tab-btn');
                    tabButtons[data.tab].click();
                } else {
                    // Just highlight the selection
                    if (data.item <= 2) {
                        // Highlight tab
                        document.querySelectorAll('.tab-btn').forEach((btn, index) => {
                            btn.classList.toggle('highlighted', index === data.tab);
                        });
                    } else {
                        // Highlight library item
                        const items = document.querySelectorAll('.library-item');
                        items.forEach((item, index) => {
                            item.classList.toggle('selected', index === (data.item - 3));
                        });
                        
                        // Scroll into view if needed
                        const selectedItem = items[data.item - 3];
                        if (selectedItem) {
                            selectedItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }
                }
            });
        };

        // Add logout button handler
        document.getElementById('logoutBtn').onclick = () => {
            fetch('/logout', { 
                method: 'POST',
                credentials: 'same-origin'
            })
            .then(() => {
                // Clear any client-side data
                localStorage.clear();
                sessionStorage.clear();
                // Force reload from server
                window.location.href = '/login';
            })
            .catch(error => {
                console.error('Logout failed:', error);
                // Fallback to direct login redirect
                window.location.href = '/login';
            });
        };

        // Make sure these are at the global level for access by all functions
        let currentTab = 'playlists';
        let currentPage = 0;
        const itemsPerPage = 20;

        // Add tab switching logic
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('active');
                    b.classList.remove('highlighted');
                });
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                currentPage = 0; // Reset page when changing tabs
                loadLibraryContent(currentTab === 'songs' ? 'liked-songs' : currentTab);
            };
        });

        // Update loadLibraryContent function to handle pagination
        function loadLibraryContent(tab, offset = 0) {
            const contentDiv = document.getElementById('library-content');
            contentDiv.innerHTML = 'Loading...';

            fetch(`/${tab}?offset=${offset}&limit=${itemsPerPage}`)
                .then(response => response.json())
                .then(items => {
                    renderLibraryItems(items, tab);
                    
                    // Show/hide pagination buttons
                    document.getElementById('prevPage').style.display = 
                        offset > 0 ? 'inline-block' : 'none';
                })
                .catch(error => {
                    contentDiv.innerHTML = `Error loading ${tab}: ${error.message}`;
                });
        }

        function renderLibraryItems(items, tab) {
            const contentDiv = document.getElementById('library-content');
            
            // Add back button at the top
            let html = `
                <div class="back-button library-item" data-action="back">
                    <div>↑ Back to Tabs</div>
                </div>
            `;
            
            // Add library items
            html += items.map((item, index) => {
                if (tab === 'albums') {
                    const album = item.album;
                    return `
                        <div class="library-item" data-uri="${album.uri}" data-index="${index}">
                            <img src="${album.images[0]?.url || 'default-cover.png'}" alt="Cover">
                            <div>
                                <div>${album.name}</div>
                                <div class="artist">${album.artists[0]?.name || 'Unknown Artist'}</div>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="library-item" data-uri="${item.uri || item.track?.uri}" data-index="${index}">
                            <img src="${item.images?.[0]?.url || item.track?.album?.images?.[0]?.url || 'default-cover.png'}" 
                                 alt="Cover">
                            <div>
                                <div>${item.name || item.track?.name}</div>
                                <div class="artist">
                                    ${item.owner?.display_name || item.artists?.[0]?.name || 
                                      item.track?.artists?.[0]?.name || 'Unknown'}
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');
            
            contentDiv.innerHTML = html;

            // Add click handler for back button
            const backButton = document.querySelector('.back-button');
            if (backButton) {
                backButton.onclick = () => {
                    // Send back command via socket
                    fetch('/ui-update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            returnToTabs: true
                        })
                    });
                };
            }

            // Add click handlers for items
            document.querySelectorAll('.library-item:not(.back-button)').forEach((item, index) => {
                item.onclick = () => {
                    const uri = item.dataset.uri;
                    if (!uri) return;
                    
                    document.querySelectorAll('.library-item').forEach(i => {
                        i.classList.remove('selected');
                        i.classList.remove('highlighted');
                    });
                    
                    item.classList.add('selected');
                    
                    fetch('/play-context', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ uri })
                    }).catch(error => {
                        console.error('Play error:', error);
                    });
                };
            });
        }

        // Pagination handlers
        document.getElementById('nextPage').onclick = () => {
            currentPage++;
            loadLibraryContent(
                currentTab === 'songs' ? 'liked-songs' : currentTab,
                currentPage * itemsPerPage
            );
        };

        document.getElementById('prevPage').onclick = () => {
            if (currentPage > 0) {
                currentPage--;
                loadLibraryContent(
                    currentTab === 'songs' ? 'liked-songs' : currentTab,
                    currentPage * itemsPerPage
                );
            }
        };


        // Add to your index.html socket.io handler
        socket.on('ui-update', function(data) {
            if (data.focus_change) {
                // Get all focusable elements
                const focusable = Array.from(document.querySelectorAll(
                    'button, [href], input, select, textarea, .library-item, .tab-btn'
                )).filter(el => !el.disabled && el.offsetParent !== null);
                
                const currentIndex = focusable.indexOf(document.activeElement);
                let nextIndex;
                
                if (data.focus_change === 'next') {
                    nextIndex = currentIndex + 1 >= focusable.length ? 0 : currentIndex + 1;
                } else {
                    nextIndex = currentIndex - 1 < 0 ? focusable.length - 1 : currentIndex - 1;
                }
                
                focusable[nextIndex].focus();
                
            } else if (data.trigger_click) {
                // Simulate click on focused element
                document.activeElement.click();
            }
        });
    </script>
</body>
</html>
