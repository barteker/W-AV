<!DOCTYPE html>
<html>
<head>
    <title>W/AV Player</title>
    <style>
        body {
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .now-playing {
            text-align: center;
            margin: 20px 0;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            background: #1db954;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            cursor: pointer;
        }
        button:hover {
            background: #1ed760;
        }
        #albumArt {
            width: 300px;
            height: 300px;
            margin: 20px auto;
            display: block;
        }
        #logoutBtn {
            background: #e74c3c;
            margin-left: 20px;
        }
        #logoutBtn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="now-playing">
            <img id="albumArt" src="placeholder.png">
            <h2 id="trackName">Not Playing</h2>
            <p id="artistName"></p>
        </div>
        <div class="controls">
            <button id="prevBtn">Previous</button>
            <button id="playPauseBtn">Play</button>
            <button id="nextBtn">Next</button>
        </div>
    </div>

    <script src="player.js"></script>
</body>
</html>
